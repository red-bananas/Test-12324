name: Release Mobile App

on:
  push:
    tags:
      - "tile-merge@v*.*"
  workflow_dispatch:
    inputs:
      app:
        description: Mobile app slug
        required: true
        type: choice
        options:
          - tile-merge
      version:
        description: Version (e.g. 1.0.0)
        required: true
      profile:
        description: EAS build profile
        required: true
        type: choice
        options:
          - production
          - preview
        default: production
      submit:
        description: Submit to Play Store after build (production only)
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/tile-merge/package-lock.json

      - name: Resolve slug, version, and profile
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slug=${{ github.event.inputs.app }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "profile=${{ github.event.inputs.profile }}" >> "$GITHUB_OUTPUT"
            echo "submit=${{ github.event.inputs.submit }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME}"
            echo "slug=${TAG%%@*}" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#*@v}" >> "$GITHUB_OUTPUT"
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "submit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Load app directory
        id: paths
        run: |
          DIR=$(node -pe "JSON.parse(require('fs').readFileSync('tools/mobile/mobile.json','utf8')).apps['${{ steps.meta.outputs.slug }}'].dir")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Validate mobile app
        run: node tools/mobile/validate.mjs "${{ steps.meta.outputs.slug }}"

      - name: Install app dependencies
        working-directory: ${{ steps.paths.outputs.dir }}
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          # package-lock may reference a corporate mirror; GitHub runners use public npm.
          if [ -f package-lock.json ]; then
            sed -i 's|https://artifact-keeper-gusw1.sidp.reports.mn/npm/maximus-dev-npm-virtual/|https://registry.npmjs.org/|g' package-lock.json
          fi
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Unit tests
        run: npm run test:mobile -- "${{ steps.meta.outputs.slug }}"

      - name: Sync version
        run: |
          node tools/mobile/sync-version.mjs "${{ steps.meta.outputs.slug }}" "${{ steps.meta.outputs.version }}"

      - name: Check release secrets
        if: steps.meta.outputs.profile == 'production' && steps.meta.outputs.submit == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        run: node tools/mobile/check-release-secrets.mjs

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write Google Play service account key
        if: steps.meta.outputs.profile == 'production' && steps.meta.outputs.submit == 'true'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_KEY" ]; then
            echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_KEY" > "${{ runner.temp }}/play-store-key.json"
            echo "EXPO_ANDROID_SERVICE_ACCOUNT_KEY_PATH=${{ runner.temp }}/play-store-key.json" >> "$GITHUB_ENV"
          fi

      - name: EAS Build (Android)
        working-directory: ${{ steps.paths.outputs.dir }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile "${{ steps.meta.outputs.profile }}" \
            --non-interactive \
            --wait

      - name: EAS Submit (Play production track)
        if: steps.meta.outputs.profile == 'production' && steps.meta.outputs.submit == 'true'
        working-directory: ${{ steps.paths.outputs.dir }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ANDROID_SERVICE_ACCOUNT_KEY_PATH: ${{ env.EXPO_ANDROID_SERVICE_ACCOUNT_KEY_PATH }}
        run: |
          eas submit \
            --platform android \
            --profile production \
            --non-interactive \
            --latest

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/
          git diff --staged --quiet || git commit -m "chore(release): ${{ steps.meta.outputs.slug }} v${{ steps.meta.outputs.version }}"
          git push origin HEAD:master || true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('{0}@v{1}', steps.meta.outputs.slug, steps.meta.outputs.version) }}
          name: ${{ steps.meta.outputs.slug }} v${{ steps.meta.outputs.version }}
          generate_release_notes: true
