<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jx Fromtter</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    html, body { width: 520px !important; min-width: 520px !important; min-height: 520px !important; height: 98vh; }
    .container { width: 520px !important; min-width: 520px !important; min-height: 520px !important; height: 98vh; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Jx Fromtter <span id="error" class="error"></span></h1>
      <button id="theme-toggle" title="Toggle light/dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path>
        </svg>
      </button>
    </header>
    
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search in document...">
      <div class="search-controls">
        <button id="search-prev">◄</button>
        <span id="search-count">0/0</span>
        <button id="search-next">►</button>
      </div>
    </div>
    
    <div class="editor-wrapper">
      <div id="editor" class="code-editor" contenteditable="true" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Paste or edit JSON or XML..."></div>
    </div>
    
    <div class="status-bar">
      <div id="char-count">Characters: 0</div>
    </div>
    
    <div class="actions">
      <button id="format">Format</button>
      <button id="minify">Minify</button>
      <button id="copy">Copy</button>
      <button id="download">Download</button>
      <button id="paste">Paste</button>
    </div>
  </div>
  <script src="format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
