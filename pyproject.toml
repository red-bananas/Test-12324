[project]
name = "auto-app"
version = "0.1.0"
description = "Autonomous app-cloning pipeline (web utility tools + mobile casual games)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "sqlalchemy>=2.0.0",
    "sqlalchemy-libsql>=0.1.0",
    "litellm>=1.50.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
agent = ["aider-chat>=0.69.0"]
e2e   = ["playwright>=1.48.0"]

[project.scripts]
auto-app = "pipeline.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "dashboard*"]
